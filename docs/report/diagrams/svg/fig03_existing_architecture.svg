5" height="72" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="792.5" y="303.6" font-size="19" text-anchor="middle" font-weight="normal" fill="#000000">Tone Shift</text><rect x="920" y="262" width="215" height="72" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="1027.5" y="303.6" font-size="19" text-anchor="middle" font-weight="normal" fill="#000000">Investment</text><rect x="450" y="350" width="215" height="72" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="557.5" y="391.6" font-size="19" text-anchor="middle" font-weight="normal" fill="#000000">Simulation</text><rect x="685" y="350" width="215" height="72" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="792.5" y="391.6" font-size="19" text-anchor="middle" font-weight="normal" fill="#000000">Comparison</text><rect x="920" y="350" width="215" height="72" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="1027.5" y="379.4" font-size="19" text-anchor="middle" font-weight="normal" fill="#000000">Statement</text><text x="1027.5" y="403.8" font-size="19" text-anchor="middle" font-weight="normal" fill="#000000">Extraction</text><path d="M 855.0 175.0 L 855.0 215.0" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#arr)"/><rect x="430" y="478" width="730" height="85" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="795.0" y="515.5" font-size="20" text-anchor="middle" font-weight="normal" fill="#000000">LLM generation backbone</text><text x="795.0" y="538.3" font-size="17" text-anchor="middle" font-weight="normal" fill="#333333">Gemini 2.5 Flash · Gemini 2.5 Flash-Lite · Qwen2.5-7B · Llama-3.2-3B</text><path d="M 795.0 440.0 L 795.0 478.0" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#arr)"/><rect x="430" y="588" width="450" height="62" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="655.0" y="614.4" font-size="19" text-anchor="middle" font-weight="normal" fill="#000000">Answer to the user</text><text x="655.0" y="635.9" font-size="16" text-anchor="middle" font-weight="normal" fill="#333333">narrative, with hold / re-evaluate / sell advice</text><rect x="900" y="588" width="260" height="62" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="1030.0" y="614.4" font-size="19" text-anchor="middle" font-weight="normal" fill="#000000">LLM-as-a-judge</text><text x="1030.0" y="635.9" font-size="16" text-anchor="middle" font-weight="normal" fill="#333333">one evaluator per agent</text><path d="M 655.0 563.0 L 655.0 588.0" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#arr)"/><path d="M 1030.0 563.0 L 1030.0 588.0" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#arr)"/><path d="M 430.0 400.0 L 400.0 400.0 L 400.0 555.0 L 362.0 555.0" fill="none" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="205.0" y="648.0" font-size="17" text-anchor="middle" font-weight="normal" fill="#333333">each agent retrieves top-k = 10</text><rect x="20" y="690" width="1160" height="205" rx="6" fill="none" stroke="#000" stroke-width="1.5"/><text x="44.0" y="728.0" font-size="20" text-anchor="start" font-weight="bold" fill="#000000">Limitations relevant to this project</text><circle cx="49" cy="762.1" r="3.6" fill="#000000"/><text x="62.0" y="768.0" font-size="18" text-anchor="start" font-weight="normal" fill="#000000">Earnings-call transcripts only: no 10-K / 10-Q filings, 8-K events or exact XBRL numbers</text><circle cx="49" cy="788.2" r="3.6" fill="#000000"/><text x="62.0" y="794.1" font-size="18" text-anchor="start" font-weight="normal" fill="#000000">Single-intent routing: a question needing lookup + comparison still goes to one agent</text><circle cx="49" cy="814.3" r="3.6" fill="#000000"/><text x="62.0" y="820.2" font-size="18" text-anchor="start" font-weight="normal" fill="#000000">No numeric tools: the LLM reads the text and computes every number itself</text><circle cx="49" cy="840.4" r="3.6" fill="#000000"/><text x="62.0" y="846.3" font-size="18" text-anchor="start" font-weight="normal" fill="#000000">No code check that each claim matches its source; quality is judged by LLMs only</text><circle cx="49" cy="866.5" r="3.6" fill="#000000"/><text x="62.0" y="872.4" font-size="18" text-anchor="start" font-weight="normal" fill="#000000">Produces hold / sell style recommendations rather than verifiable, cited analysis</text></svg>