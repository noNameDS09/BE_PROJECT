[project]
name = "loupe"
version = "0.1.0"
description = "Agent-Orchestrated Financial Risk Extraction and Conversational Intelligence for Indian Listed Companies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    # Orchestration
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # LLM Access
    "litellm>=1.50",
    # Embeddings & Vector Store
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    # EDGAR / SEC Access
    "sec-edgar-downloader>=1.0",
    "sec-api>=1.0",
    # PDF / HTML Parsing
    "pymupdf>=1.23",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    # XBRL
    "xbrl>=1.0",
    # Data & Results
    "duckdb>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    # CLI
    "typer>=0.12",
    "rich>=13.7",
    # Testing & Quality
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "langsmith>=0.1",
]
eval = [
    "ragas>=0.2",
    "scikit-learn>=1.5",
]

[tool.uv]
dev-dependencies = [
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "W", "C4", "C9", "D", "T20", "PYI", "PT", "Q", "RUF", "SIM", "TID", "TRY", "ARG", "PTH", "ERA", "PD", "PL", "RET", "ASYNC"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "S101", "S311", "S603", "S607"]
fixable = ["ALL"]
unfixable = ["T20", "D", "S101", "S311", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true