[project]
name = "loupe"
version = "0.2.0"
description = "Cited financial-risk copilot: event extraction, orchestrated agents and a benchmarking harness over company filings"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "litellm>=1.50",
    "diskcache>=5.6",
    "typer>=0.12",
    "rich>=13.7",
    "edgartools>=4.0",
    "duckdb>=1.5.6",
]

[project.scripts]
loupe = "loupe.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loupe"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
