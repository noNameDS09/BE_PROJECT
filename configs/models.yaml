# Model registry. Every LLM call goes through loupe.llm.Gateway using an alias below.
#
# Free-tier survey and live test, 2026-10-19: results in docs/models.md. IDs were checked against each
# provider's live model list where it is public (OpenRouter, NVIDIA NIM); Gemini, Groq and
# Mistral IDs come from their docs. Run `loupe models check` after adding keys: it confirms
# each model answers, supports tool calls and JSON mode.
#
# rpm: requests per minute we allow ourselves (0 = no limit), set below the provider's cap.
# The daily caps that actually bind are noted per entry; see docs/models.md for capacity.

models:
  # --- Google AI Studio (free tier; per-project limits shown in AI Studio) --------------
  gemini-flash-lite:            # FARE's backbone; still free. ~15 RPM, ~1,000 RPD
    model: gemini/gemini-2.5-flash-lite
    provider: gemini
    rpm: 12
  gemini-3.1-flash-lite:        # newer Flash-Lite, free tier
    model: gemini/gemini-3.1-flash-lite
    provider: gemini
    rpm: 12
  gemini-flash:                 # FARE's backbone; still free. ~10 RPM, ~250 RPD
    model: gemini/gemini-2.5-flash
    provider: gemini
    rpm: 8
  gemini-3.6-flash:             # current Flash, free tier
    model: gemini/gemini-3.6-flash
    provider: gemini
    rpm: 8

  # --- NVIDIA NIM (build.nvidia.com; free, up to 40 RPM per model, no daily cap published) ---
  nim-nemotron-ultra:           # MAIN MODEL from 2026-10-23: Nemotron 3 Ultra 550B MoE, tool calling
    model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
    provider: nvidia_nim
    rpm: 35
    fallback: or-nemotron-ultra  # same weights via OpenRouter when NIM fails
  nim-nemotron-super:           # RETIRED by NVIDIA on 2026-10-20 (404 on NIM and OpenRouter);
    model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b  # kept so pilot 1-3 rows still resolve
    provider: nvidia_nim
    rpm: 35
  nim-gemma-4-31b:
    model: nvidia_nim/google/gemma-4-31b-it
    provider: nvidia_nim
    rpm: 35
  nim-gpt-oss-20b:
    model: nvidia_nim/openai/gpt-oss-20b
    provider: nvidia_nim
    rpm: 35

  # --- Mistral La Plateforme, Experiment tier (free; ~1 request/s; phone verification) ---
  mistral-medium:               # Mistral Medium 3.5: different family from generators -> judge
    model: mistral/mistral-medium-3.5
    provider: mistral
    rpm: 20
  mistral-small:
    model: mistral/mistral-small-2603
    provider: mistral
    rpm: 20
  ministral-14b:
    model: mistral/ministral-14b-2512
    provider: mistral
    rpm: 20

  # --- Groq (free; 30 RPM; daily TOKEN caps bind first: 200K TPD large, 500K TPD 8B) ---
  groq-gpt-oss-120b:            # 1K RPD, 200K TPD; ~8K input tokens/min: short prompts only
    model: groq/openai/gpt-oss-120b
    provider: groq
    rpm: 25
  groq-qwen-27b:                # 1K RPD, 200K TPD; 7K input tokens/min: short prompts only
    model: groq/qwen/qwen3.8-27b
    provider: groq
    rpm: 25

  # --- OpenRouter :free (20 RPM; our account has the 1,000 requests/day limit) ---
  or-nemotron-ultra:
    model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
    provider: openrouter
    rpm: 15
  or-nemotron-lightning:        # Nemotron 3.5 Lightning: small and fast
    model: openrouter/nvidia/nemotron-3.5-lightning:free
    provider: openrouter
    rpm: 15
  or-nemotron-super:            # RETIRED upstream on 2026-10-20 (see nim-nemotron-super)
    model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
    provider: openrouter
    rpm: 15
  or-gemma-4-31b:
    model: openrouter/google/gemma-4-31b-it:free
    provider: openrouter
    rpm: 15

  # --- Ollama Cloud (ollama.com; free plan: 1 concurrent request, session/weekly usage caps) ---
  oc-gpt-oss-120b:
    model: ollama_chat/gpt-oss:120b
    provider: ollama_cloud
    rpm: 20
  oc-gemma4-31b:
    model: ollama_chat/gemma4:31b
    provider: ollama_cloud
    rpm: 20
    fallback: nim-gemma-4-31b  # same weights on NVIDIA NIM (slower) when Ollama Cloud's cap is hit
