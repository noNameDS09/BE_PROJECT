# US company universe (decision D3, docs/decisions.md).
#
# `selection` is edited by people; `companies` is written by `loupe universe build`,
# which resolves CIKs from SEC's ticker file, checks eligibility and assigns the split.
#
# Rule:
#  - financebench: the 15 FinanceBench open-sample companies with the most questions that still
#    file 10-Ks (118 of the 150 open questions).
#  - event: 10 companies with revenue >= $1B (CY2024 XBRL frames) and FY2023-25 8-K risk items
#    (1.03 bankruptcy, 1.05 cyber incident, 2.04 acceleration trigger, 2.06 impairment,
#    4.01 auditor change, 4.02 non-reliance), from an EDGAR full-text search scan on 2026-10-13,
#    chosen to cover every item type and different sectors.
#  - every company needs >= 3 10-K and >= 6 10-Q with period of report in 2023-01-01..2025-12-31.
# split: 8 dev / 17 test, stratified by sector, random.Random(seed).

version: 1
window: {start: 2023-01-01, end: 2025-12-31}
split: {seed: 20261013, n_dev: 8}

selection:
  # FinanceBench overlap (question count in the open sample)
  - {ticker: PEP,  group: financebench, sector: Consumer Staples, reason: "11 questions"}
  - {ticker: AMCR, group: financebench, sector: Materials, reason: "9 questions"}
  - {ticker: JNJ,  group: financebench, sector: Health Care, reason: "9 questions"}
  - {ticker: MMM,  group: financebench, sector: Industrials, reason: "8 questions"}
  - {ticker: AMD,  group: financebench, sector: Information Technology, reason: "8 questions"}
  - {ticker: BBY,  group: financebench, sector: Consumer Discretionary, reason: "8 questions"}
  - {ticker: BA,   group: financebench, sector: Industrials, reason: "8 questions"}
  - {ticker: AXP,  group: financebench, sector: Financials, reason: "7 questions"}
  - {ticker: MGM,  group: financebench, sector: Consumer Discretionary, reason: "7 questions"}
  - {ticker: PFE,  group: financebench, sector: Health Care, reason: "6 questions"}
  - {ticker: ULTA, group: financebench, sector: Consumer Discretionary, reason: "6 questions"}
  - {ticker: ADBE, group: financebench, sector: Information Technology, reason: "5 questions"}
  - {ticker: JPM,  group: financebench, sector: Financials, reason: "5 questions"}
  - {ticker: VZ,   group: financebench, sector: Communication Services, reason: "5 questions"}
  - {ticker: CVS,  group: financebench, sector: Health Care, reason: "4 questions; 8-K 2.04"}
  # Risk events (8-K items in the window)
  - {ticker: ADM,  group: event, sector: Consumer Staples, reason: "4.02 non-reliance (accounting review)"}
  - {ticker: UNH,  group: event, sector: Health Care, reason: "1.05 cybersecurity incident"}
  - {ticker: DBD,  group: event, sector: Information Technology, reason: "1.03 bankruptcy x3, 2.04"}
  - {ticker: SHAK, group: event, sector: Consumer Discretionary, reason: "4.02 x2, 2.06"}
  - {ticker: SAH,  group: event, sector: Consumer Discretionary, reason: "4.01, 2.06, 1.05"}
  - {ticker: ECHO, group: event, sector: Communication Services, reason: "2.04 x3"}
  - {ticker: KR,   group: event, sector: Consumer Staples, reason: "2.04, 2.06"}
  - {ticker: RIG,  group: event, sector: Energy, reason: "2.06 x6"}
  - {ticker: CMP,  group: event, sector: Materials, reason: "4.01, 4.02"}
  - {ticker: BFH,  group: event, sector: Financials, reason: "2.04 x3"}

